<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinite Mind Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        svg: { fontCache: 'global' },
        startup: {
          typeset: false // We will manually typeset new elements
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f3f4f6; }
      /* Custom scrollbar for simulation containers */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      
      /* MathJax specific overrides for foreignObject */
      mjx-container { font-size: 100% !important; }

      /* Markdown Styles */
      .markdown-content ul { list-style-type: disc; padding-left: 1.2em; }
      .markdown-content ol { list-style-type: decimal; padding-left: 1.2em; }
      .markdown-content strong { font-weight: bold; }
      .markdown-content em { font-style: italic; }
      .markdown-content h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.2em; }
      .markdown-content h2 { font-size: 1.2em; font-weight: bold; margin-bottom: 0.2em; }
      .markdown-content blockquote { border-left: 3px solid #cbd5e1; padding-left: 0.5em; color: #475569; }
      .markdown-content pre { background: #f1f5f9; padding: 0.2em; border-radius: 4px; }
      .markdown-content p { margin: 0; padding: 0; }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-markdown": "https://esm.sh/react-markdown@9?bundle"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
